[package]
name = "usage-widget"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "accesskit"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# native-tls = SChannel: Windows cert store, so the corporate TLS-inspection root is trusted.
ureq = { version = "3.5.0", default-features = false, features = ["native-tls"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Shell"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
